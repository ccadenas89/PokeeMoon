<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Adventure</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="bg-sprites"></div>
<div id="app">
<div id="s-intro" class="screen active">
  <div class="pb-wrap">
    <p style="text-align:center;font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px">¡Bienvenido a Pueblo Paleta!</p>
    <p style="text-align:center;margin-bottom:20px;font-size:13px">Agita la Poké Ball 3 veces para descubrir tu inicial</p>
    <div class="pokeball" id="pb" onclick="shakeBall()">
      <div class="pb-top"></div><div class="pb-mid"><div class="pb-btn"></div></div><div class="pb-bot"></div>
    </div>
    <p id="pb-hint" style="margin-top:14px;font-size:12px;color:var(--color-text-secondary);text-align:center">Toca para agitar</p>
    <div style="display:flex;gap:6px;margin-top:10px">
      <div id="sh0" style="width:10px;height:10px;border-radius:50%;background:var(--color-border-tertiary)"></div>
      <div id="sh1" style="width:10px;height:10px;border-radius:50%;background:var(--color-border-tertiary)"></div>
      <div id="sh2" style="width:10px;height:10px;border-radius:50%;background:var(--color-border-tertiary)"></div>
    </div>
  </div>
</div>
<div id="s-reveal" class="screen"><div id="reveal-inner" style="text-align:center;padding:2rem 1rem"></div></div>
<div id="s-roulette" class="screen">
  <div class="roulette-wrap">
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px" id="rou-title">¡Evento entre nodos!</p>
    <div class="rou-ptr">▼</div>
    <div class="rou-wheel" id="rou-wheel"></div>
    <div class="rou-result" id="rou-result"></div>
    <button id="rou-btn" onclick="spinRoulette()">Girar ruleta</button>
  </div>
</div>
<div id="s-item" class="screen">
  <div class="item-found-card">
    <div style="font-size:52px;margin-bottom:8px" id="item-ico"></div>
    <div class="item-rarity" id="item-rbadge"></div>
    <h2 id="item-name" style="margin-bottom:4px"></h2>
    <p id="item-desc" style="font-size:13px;margin-bottom:16px"></p>
    <button onclick="itemContinue()">Continuar →</button>
  </div>
</div>
<div id="s-gym-preview" class="screen">
  <div class="gym-preview">
    <h3 id="gp-title"></h3>
    <p id="gp-sub" style="font-size:12px;margin-bottom:10px"></p>
    <div class="gym-team" id="gp-team"></div>
  </div>
  <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px" id="gp-advice"></p>
  <div style="display:flex;gap:7px">
    <button onclick="confirmGym()">¡Luchar!</button>
    <button onclick="backFromGym()">← Volver al mapa</button>
  </div>
</div>
<div id="s-world" class="screen">
  <div class="hud" id="whud"></div>
  <div class="tabs">
    <button class="tab active" id="tb-map" onclick="wTab('map')">Ruta</button>
    <button class="tab" id="tb-team" onclick="wTab('team')">Equipo</button>
    <button class="tab" id="tb-bag" onclick="wTab('bag')">Mochila</button>
  </div>
  <div id="tw-map"><div class="route-map" id="rmap"></div></div>
  <div id="tw-team" style="display:none"><div class="pkgrid" id="tgrid"></div></div>
  <div id="tw-bag" style="display:none"><div style="display:flex;flex-direction:column;gap:5px;margin-top:8px" id="bagui"></div></div>
</div>
<div id="s-battle" class="screen">
  <div id="lvup-banner" class="lvup-banner"></div>
  <div class="battle-box">
    <div class="ftr enemy"><div class="sp" id="b-es"></div><div class="fi"><div class="fn" id="b-en"></div><div class="fl" id="b-el"></div><div class="hpb"><div class="hpf" id="b-eh" style="background:#E24B4A"></div></div><div class="hpt" id="b-eht"></div></div></div>
    <div class="divl"></div>
    <div class="ftr"><div class="sp" id="b-ps"></div><div class="fi"><div class="fn" id="b-pn"></div><div class="fl" id="b-pl"></div><div class="hpb"><div class="hpf" id="b-ph" style="background:#639922"></div></div><div class="hpt" id="b-pht"></div></div></div>
  </div>
  <div class="blog" id="blog"></div>
  <div id="b-main">
    <div class="mgrid" id="bmoves"></div>
    <div class="arow">
      <button onclick="bAct('bag')">Mochila</button>
      <button id="b-catch-btn" onclick="bAct('catch')">Poké Ball</button>
      <button onclick="bAct('run')" id="b-run-btn">Huir</button>
    </div>
  </div>
  <div id="b-bag-panel" style="display:none">
    <p style="font-size:12px;margin-bottom:6px">Elige objeto:</p>
    <div style="display:flex;flex-direction:column;gap:5px" id="b-bag-items"></div>
    <button onclick="showBMain()" style="margin-top:7px">← Volver</button>
  </div>
</div>
<div id="s-learn" class="screen">
  <div class="learn-modal">
    <h2 id="learn-title"></h2>
    <p id="learn-sub" style="font-size:13px"></p>
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:8px" id="learn-opts"></div>
  </div>
</div>
<div id="s-result" class="screen">
  <div style="text-align:center;padding:2rem 1rem">
    <div style="font-size:56px" id="res-ico"></div>
    <h2 id="res-title" style="margin:10px 0 5px"></h2>
    <p id="res-msg" style="margin-bottom:18px"></p>
    <div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap" id="res-acts"></div>
  </div>
</div>
</div>


<script src="../js/game.js"></script>
</body>
</html>
